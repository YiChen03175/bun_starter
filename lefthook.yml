pre-commit:
  parallel: true
  commands:
    lint:
      run: bunx biome check --write --files-ignore-unknown=true {staged_files}
      glob: "*.{js,jsx,ts,tsx,json,css}"
      stage_fixed: true
    type-check:
      run: bun run type-check

pre-push:
  commands:
    validate:
      run: bun run validate && bun run build
